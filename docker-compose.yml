version: '3.8'

services:
  # Primary Transactional Database & JSONB Storage
  postgres:
    image: postgres:15-alpine
    container_name: flowpay-postgres
    restart: always
    environment:
      POSTGRES_USER: flowpay_user
      POSTGRES_PASSWORD: flowpay_password
      POSTGRES_DB: flowpay_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowpay_user -d flowpay_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # In-Memory Cache, Rate Limiting, and Distributed Locking
  redis:
    image: redis:7-alpine
    container_name: flowpay-redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Kafka Distributed Event Broker Dependencies
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: flowpay-zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: flowpay-kafka
    restart: always
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

volumes:
  postgres_data:
  redis_data:
